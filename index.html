<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#38bdf8">
  <title>DevLexicon - Glossario Tecnico Cloud</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --badge: #0369a1;
      --badge-new: #15803d;
      --danger: #ef4444;
      --code-bg: #0b1120;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      padding: 2rem 1rem 1rem 1rem; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      min-height: 100vh; 
    }
    .container { width: 100%; max-width: 900px; flex: 1; }

    /* Header */
    .header-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .header-titles h1 { font-size: 2.2rem; color: var(--accent); margin-bottom: 0.2rem; }
    .header-titles p { color: var(--text-muted); font-size: 0.95rem; }
    .header-actions { display: flex; gap: 0.5rem; }

    .btn-icon {
      background: var(--card-bg); border: 1px solid var(--border); color: var(--text);
      font-size: 1.1rem; padding: 0.5rem 0.7rem; border-radius: 8px; cursor: pointer;
      transition: all 0.2s;
    }
    .btn-icon:hover { background: #334155; }
    .btn-icon.unlocked { border-color: var(--danger); color: var(--danger); background: rgba(239, 68, 68, 0.1); }

    /* Pannello Impostazioni */
    .settings-panel {
      display: none; background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem;
    }
    .settings-panel.open { display: block; }
    .settings-row { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.5rem; }
    .settings-row input {
      flex: 1; padding: 0.5rem 0.8rem; border-radius: 6px; border: 1px solid var(--border);
      background: #0f172a; color: var(--text); outline: none; font-size: 0.9rem;
    }

    /* Barra Info Sincronizzazione & Azioni */
    .tools-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem; background: rgba(30, 41, 59, 0.5); padding: 0.6rem 1rem;
      border-radius: 8px; border: 1px solid var(--border); flex-wrap: wrap; gap: 0.5rem;
    }
    .tools-bar span { font-size: 0.85rem; color: var(--text-muted); }
    .sync-badge { color: #4ade80; font-size: 0.8rem; font-weight: 600; }
    .tools-buttons { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    .btn-action {
      padding: 0.4rem 0.8rem; background: var(--border); color: var(--text); border: none;
      border-radius: 4px; cursor: pointer; font-size: 0.85rem; transition: background 0.2s;
    }
    .btn-action:hover { background: #475569; }
    .btn-action.btn-seed { background: #0369a1; font-weight: 600; }
    .btn-action.btn-seed:hover { background: #0284c7; }
    .btn-action.btn-import { background: #0d9488; font-weight: 600; }
    .btn-action.btn-import:hover { background: #0f766e; }

    /* Ricerca */
    .search-box { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .search-box input {
      flex: 1; padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid var(--border);
      background: var(--card-bg); color: var(--text); font-size: 1rem; outline: none;
    }
    .search-box input:focus { border-color: var(--accent); }

    /* Categorie */
    .categories-bar {
      display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.8rem; margin-bottom: 1rem;
      scrollbar-width: thin;
    }
    .cat-filter-btn {
      padding: 0.35rem 0.8rem; border-radius: 20px; border: 1px solid var(--border);
      background: var(--card-bg); color: var(--text-muted); cursor: pointer; font-size: 0.8rem;
      white-space: nowrap; transition: all 0.2s;
    }
    .cat-filter-btn.active {
      background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600;
    }

    /* Switch Sintesi / Dettaglio */
    .view-toggle { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    .btn-toggle {
      flex: 1; padding: 0.6rem; border: 1px solid var(--border); background: var(--card-bg);
      color: var(--text-muted); border-radius: 6px; cursor: pointer; font-weight: 600;
      transition: all 0.2s;
    }
    .btn-toggle.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }

    /* Card Termine */
    .term-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 1.5rem; margin-bottom: 1.2rem;
    }
    .card-header {
      display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem;
    }
    .term-card h2 { color: var(--accent); font-size: 1.3rem; }

    /* Pulsante Cestino Protetto (Nascosto di Default) */
    .btn-delete {
      display: none;
      background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: var(--danger);
      cursor: pointer; font-size: 0.85rem; padding: 0.3rem 0.6rem; border-radius: 6px;
      font-weight: 600; transition: all 0.2s;
    }
    .btn-delete:hover { background: var(--danger); color: white; }
    body.edit-mode .btn-delete { display: inline-flex; align-items: center; gap: 0.3rem; }

    .badge-group { display: flex; gap: 0.5rem; margin-bottom: 0.8rem; }
    .category-badge {
      display: inline-block; font-size: 0.75rem; background: var(--badge); color: white;
      padding: 0.2rem 0.6rem; border-radius: 4px; text-transform: uppercase; font-weight: 600;
    }
    .new-badge {
      display: inline-block; font-size: 0.75rem; background: var(--badge-new); color: white;
      padding: 0.2rem 0.6rem; border-radius: 4px; text-transform: uppercase; font-weight: 600;
    }
    .text-content { line-height: 1.6; color: var(--text); }

    /* Code Block */
    .code-block {
      margin-top: 1rem; background: var(--code-bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 1rem; overflow-x: auto;
    }
    .code-header { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.5rem; font-weight: 700; }
    pre code { font-family: 'Consolas', 'Fira Code', monospace; font-size: 0.88rem; color: #38bdf8; white-space: pre-wrap; word-break: break-word; }

    /* Not Found */
    .not-found-box {
      text-align: center; background: var(--card-bg); border: 1px dashed var(--border);
      border-radius: 10px; padding: 2.5rem 1.5rem; margin-top: 1rem;
    }
    .btn-search-web {
      margin-top: 1rem; padding: 0.7rem 1.2rem; background: var(--accent);
      color: var(--bg); border: none; border-radius: 6px; font-weight: 700;
      cursor: pointer; transition: background 0.2s;
    }
    .btn-search-web:hover { background: var(--accent-hover); }
    .spinner { display: inline-block; margin-top: 1rem; color: var(--accent); font-weight: 600; }

    /* Footer */
    footer {
      margin-top: 3rem; padding: 1.5rem 0 1rem 0; text-align: center;
      border-top: 1px solid rgba(51, 65, 85, 0.6); width: 100%; max-width: 900px;
    }
    .brand-attribution { font-size: 0.88rem; color: var(--text-muted); letter-spacing: 0.5px; margin-bottom: 0.35rem; }
    .brand-highlight { color: var(--accent); font-weight: 700; }
    .brand-author { color: #e2e8f0; font-weight: 600; }
    .brand-rights { font-size: 0.75rem; color: #64748b; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-box">
    <div class="header-titles">
      <h1>DevLexicon</h1>
      <p>Enciclopedia Tecnica Cloud con Sincronizzazione e Auto-Apprendimento AI</p>
    </div>
    <div class="header-actions">
      <button class="btn-icon" id="btnLock" title="Sblocca/Blocca eliminazione schede" onclick="toggleEditMode()">🔒</button>
      <button class="btn-icon" title="Gestione Chiave Gemini" onclick="toggleSettings()">⚙️</button>
    </div>
  </div>

  <!-- Pannello Impostazioni -->
  <div class="settings-panel" id="settingsPanel">
    <label style="font-size: 0.85rem; color: var(--text-muted);">Chiave Gemini Cloud (Sincronizzata su tutti i dispositivi):</label>
    <div class="settings-row">
      <input type="password" id="apiKeyInput" placeholder="Inserisci chiave Gemini...">
      <button class="btn-action" onclick="saveCloudApiKey()">Salva</button>
    </div>
  </div>

  <!-- Barra Info, Import & Backup -->
  <div class="tools-bar">
    <div>
      <span id="termCount">Caricamento dal cloud...</span>
      <span class="sync-badge" id="syncStatus"> ● Cloud Connesso</span>
    </div>
    <div class="tools-buttons">
      <button class="btn-action btn-import" onclick="document.getElementById('importFile').click()">📂 Importa JSON</button>
      <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importDataToCloud(event)">
      <button class="btn-action" onclick="exportData()">💾 Backup Locale</button>
    </div>
  </div>

  <!-- Barra Ricerca -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Cerca un concetto tecnico...">
  </div>

  <!-- Categorie Dinamiche -->
  <div class="categories-bar" id="categoriesBar"></div>

  <!-- Switch Modalità -->
  <div class="view-toggle">
    <button class="btn-toggle active" id="btnSummary" onclick="setViewMode('summary')">Modalità Sintetica</button>
    <button class="btn-toggle" id="btnDetail" onclick="setViewMode('detail')">Modalità Dettagliata (con Codice)</button>
  </div>

  <!-- Risultati -->
  <div id="termsList"></div>
</div>

<!-- Footer -->
<footer>
  <div class="brand-attribution">
    Software Engineered &amp; Designed by: <span class="brand-highlight">GC CodeLab</span> • <span class="brand-author">Giovanni Cavallo</span>
  </div>
  <div class="brand-rights">
    © <span id="currentYear"></span> DevLexicon • Tutti i diritti riservati
  </div>
</footer>

<script>
  document.getElementById('currentYear').textContent = new Date().getFullYear();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
    });
  }

  const firebaseConfig = {
    apiKey: "AIzaSyB2jGY3q3s4vDD_ARy-xltsjcwS3VDch7E",
    authDomain: "tachocontrol-ad132.firebaseapp.com",
    databaseURL: "https://tachocontrol-ad132-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "tachocontrol-ad132",
    storageBucket: "tachocontrol-ad132.firebasestorage.app",
    messagingSenderId: "337602106666",
    appId: "1:337602106666:web:d57e633e9cd487cf6fba53"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let glossary = [];
  let activeGeminiKey = '';
  let currentMode = 'summary';
  let selectedCategory = 'ALL';
  let isEditMode = false;

  // Attivazione/Disattivazione Sicura Modalità Eliminazione
  function toggleEditMode() {
    isEditMode = !isEditMode;
    document.body.classList.toggle('edit-mode', isEditMode);
    const lockBtn = document.getElementById('btnLock');
    if (isEditMode) {
      lockBtn.textContent = '🔓';
      lockBtn.classList.add('unlocked');
      lockBtn.title = 'Modalità modifica attiva: i cestini sono visibili. Clicca per bloccare.';
    } else {
      lockBtn.textContent = '🔒';
      lockBtn.classList.remove('unlocked');
      lockBtn.title = 'Modalità protetta: i cestini sono nascosti. Clicca per sbloccare.';
    }
  }

  function toggleSettings() {
    document.getElementById('settingsPanel').classList.toggle('open');
  }

  db.ref('settings/gemini_api_key').on('value', (snapshot) => {
    const keyVal = snapshot.val();
    if (keyVal) {
      activeGeminiKey = keyVal;
      document.getElementById('apiKeyInput').value = keyVal;
      localStorage.setItem('gemini_api_key', keyVal);
      document.getElementById('settingsPanel').classList.remove('open');
    } else {
      document.getElementById('settingsPanel').classList.add('open');
    }
  });

  db.ref('dev_lexicon_terms').on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
      glossary = Object.keys(data).map(key => ({ _fbKey: key, ...data[key] }));
    } else {
      glossary = [];
    }
    renderCategories();
    renderTerms(document.getElementById('searchInput').value);
  });

  function importDataToCloud(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async function(e) {
      try {
        const imported = JSON.parse(e.target.result);
        if (Array.isArray(imported)) {
          const updates = {};
          imported.forEach(item => {
            if (item.term) {
              const termId = item.term.toLowerCase().replace(/[^a-z0-9]/g, '_');
              updates[termId] = item;
            }
          });
          await db.ref('dev_lexicon_terms').update(updates);
          alert(`Importazione completata! ${imported.length} termini caricati su Cloud Firebase.`);
        } else {
          alert('Il file JSON non contiene un array valido di termini.');
        }
      } catch (err) {
        alert('Errore durante la lettura del file JSON: ' + err.message);
      }
      event.target.value = '';
    };
    reader.readAsText(file);
  }

  function saveCloudApiKey() {
    const key = document.getElementById('apiKeyInput').value.trim();
    if (!key) return;
    db.ref('settings/gemini_api_key').set(key)
      .then(() => {
        alert('Chiave salvata su Cloud!');
        toggleSettings();
      })
      .catch(err => alert('Errore Firebase: ' + err.message));
  }

  function setViewMode(mode) {
    currentMode = mode;
    document.getElementById('btnSummary').classList.toggle('active', mode === 'summary');
    document.getElementById('btnDetail').classList.toggle('active', mode === 'detail');
    renderTerms(document.getElementById('searchInput').value);
  }

  function setCategory(cat) {
    selectedCategory = cat;
    renderCategories();
    renderTerms(document.getElementById('searchInput').value);
  }

  function renderCategories() {
    const catBar = document.getElementById('categoriesBar');
    const categories = ['ALL', ...new Set(glossary.map(item => item.category || 'Generale'))];
    
    catBar.innerHTML = categories.map(cat => `
      <button class="cat-filter-btn ${selectedCategory === cat ? 'active' : ''}" 
              onclick="setCategory('${escapeHtml(cat)}')">
        ${cat === 'ALL' ? 'Tutte le Categorie' : escapeHtml(cat)}
      </button>
    `).join('');
  }

  // Eliminazione sicura con conferma esplicita
  function deleteTerm(fbKey, termName) {
    const conf = confirm(`ATTENZIONE:\nVuoi eliminare definitivamente "${termName}" dal database cloud?\n\nQuesta operazione non può essere annullata.`);
    if (conf) {
      db.ref('dev_lexicon_terms/' + fbKey).remove();
    }
  }

  function exportData() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(glossary, null, 2));
    const a = document.createElement('a');
    a.setAttribute("href", dataStr);
    a.setAttribute("download", `glossario_cloud_${new Date().toISOString().slice(0, 10)}.json`);
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function renderTerms(query = '') {
    const listContainer = document.getElementById('termsList');
    const cleanQuery = query.trim().toLowerCase();
    document.getElementById('termCount').innerText = `${glossary.length} termini memorizzati`;

    let filtered = glossary.filter(item => {
      const matchQuery = item.term.toLowerCase().includes(cleanQuery) || 
                         (item.category && item.category.toLowerCase().includes(cleanQuery)) ||
                         (item.summary && item.summary.toLowerCase().includes(cleanQuery));
      const matchCat = (selectedCategory === 'ALL' || item.category === selectedCategory);
      return matchQuery && matchCat;
    });

    if (filtered.length === 0 && cleanQuery.length > 0) {
      listContainer.innerHTML = `
        <div class="not-found-box">
          <p>Il termine "<strong>${escapeHtml(query)}</strong>" non è presente nell'enciclopedia.</p>
          <button class="btn-search-web" onclick="fetchTermFromWeb('${escapeHtml(query)}')">
            🔍 Cerca e Genera Scheda Tecnica con AI
          </button>
          <div id="fetchLoader"></div>
        </div>
      `;
      return;
    }

    listContainer.innerHTML = filtered.map(item => `
      <div class="term-card">
        <div class="card-header">
          <h2>${escapeHtml(item.term)}</h2>
          <button class="btn-delete" title="Elimina dal Cloud" onclick="deleteTerm('${item._fbKey}', '${escapeHtml(item.term)}')">
            🗑️ Elimina
          </button>
        </div>
        <div class="badge-group">
          <span class="category-badge">${escapeHtml(item.category || 'Generale')}</span>
          ${item.autoFetched ? '<span class="new-badge">Generato con AI</span>' : ''}
        </div>
        <p class="text-content">
          ${escapeHtml(currentMode === 'summary' ? item.summary : item.detail)}
        </p>
        ${currentMode === 'detail' && item.code ? `
          <div class="code-block">
            <div class="code-header">Snippet / Esempio Pratico:</div>
            <pre><code>${escapeHtml(item.code)}</code></pre>
          </div>
        ` : ''}
      </div>
    `).join('');
  }

  async function fetchTermFromWeb(searchTerm) {
    const apiKey = activeGeminiKey || localStorage.getItem('gemini_api_key');
    const loader = document.getElementById('fetchLoader');

    if (!apiKey) {
      alert('Chiave API non trovata. Clicca sull\'icona ⚙️ in alto a destra per inserirla.');
      return;
    }

    loader.innerHTML = `<span class="spinner">Interrogazione AI e compilazione scheda tecnica in corso...</span>`;

    const prompt = `Fornisci una scheda tecnica esaustiva sul seguente concetto di sviluppo software: "${searchTerm}".
Rispondi RIGOROSAMENTE ed ESCLUSIVAMENTE con un JSON valido (senza blocchi markdown \`\`\`json):
{
  "term": "Nome formale del termine",
  "category": "Una tra: Frontend, Backend, Database, Cloud, DevOps, Architettura, Sicurezza, Algoritmi, Networking, Testing, AI & Dati",
  "summary": "Definizione sintetica ma rigorosa (2 frasi).",
  "detail": "Spiegazione tecnica approfondita con architettura, casi d'uso ed errori comuni.",
  "code": "Snippet di codice o comando reale completo che esemplifica il funzionamento."
}`;

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
      });

      const data = await response.json();
      if (data.error) throw new Error(data.error.message);

      let rawText = data.candidates[0].content.parts[0].text;
      rawText = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();

      const newTerm = JSON.parse(rawText);
      newTerm.autoFetched = true;

      const termId = newTerm.term.toLowerCase().replace(/[^a-z0-9]/g, '_');
      await db.ref('dev_lexicon_terms/' + termId).set(newTerm);

      document.getElementById('searchInput').value = '';
      renderTerms();

    } catch (err) {
      loader.innerHTML = `<p style="color: #ef4444; margin-top: 1rem;">Errore: ${err.message}</p>`;
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  document.getElementById('searchInput').addEventListener('input', (e) => {
    renderTerms(e.target.value);
  });
</script>

</body>
</html>
