<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#38bdf8">
  <title>DevLexicon - Glossario Tecnico Cloud</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --badge: #0369a1;
      --badge-new: #15803d;
      --danger: #ef4444;
      --code-bg: #0b1120;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem 1rem; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 900px; }

    /* Header */
    .header-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .header-titles h1 { font-size: 2.2rem; color: var(--accent); margin-bottom: 0.2rem; }
    .header-titles p { color: var(--text-muted); font-size: 0.95rem; }
    .btn-settings {
      background: var(--card-bg); border: 1px solid var(--border); color: var(--text);
      font-size: 1.2rem; padding: 0.5rem 0.7rem; border-radius: 8px; cursor: pointer;
      transition: background 0.2s;
    }
    .btn-settings:hover { background: #334155; }

    /* Pannello Impostazioni */
    .settings-panel {
      display: none; background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem;
    }
    .settings-panel.open { display: block; }
    .settings-row { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.5rem; }
    .settings-row input {
      flex: 1; padding: 0.5rem 0.8rem; border-radius: 6px; border: 1px solid var(--border);
      background: #0f172a; color: var(--text); outline: none; font-size: 0.9rem;
    }

    /* Barra Info Sincronizzazione & Azioni */
    .tools-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem; background: rgba(30, 41, 59, 0.5); padding: 0.6rem 1rem;
      border-radius: 8px; border: 1px solid var(--border); flex-wrap: wrap; gap: 0.5rem;
    }
    .tools-bar span { font-size: 0.85rem; color: var(--text-muted); }
    .sync-badge { color: #4ade80; font-size: 0.8rem; font-weight: 600; }
    .tools-buttons { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    .btn-action {
      padding: 0.4rem 0.8rem; background: var(--border); color: var(--text); border: none;
      border-radius: 4px; cursor: pointer; font-size: 0.85rem; transition: background 0.2s;
    }
    .btn-action:hover { background: #475569; }
    .btn-action.btn-seed { background: #0369a1; font-weight: 600; }
    .btn-action.btn-seed:hover { background: #0284c7; }

    /* Ricerca */
    .search-box { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .search-box input {
      flex: 1; padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid var(--border);
      background: var(--card-bg); color: var(--text); font-size: 1rem; outline: none;
    }
    .search-box input:focus { border-color: var(--accent); }

    /* Categorie */
    .categories-bar {
      display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.8rem; margin-bottom: 1rem;
      scrollbar-width: thin;
    }
    .cat-filter-btn {
      padding: 0.35rem 0.8rem; border-radius: 20px; border: 1px solid var(--border);
      background: var(--card-bg); color: var(--text-muted); cursor: pointer; font-size: 0.8rem;
      white-space: nowrap; transition: all 0.2s;
    }
    .cat-filter-btn.active {
      background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600;
    }

    /* Switch Sintesi / Dettaglio */
    .view-toggle { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    .btn-toggle {
      flex: 1; padding: 0.6rem; border: 1px solid var(--border); background: var(--card-bg);
      color: var(--text-muted); border-radius: 6px; cursor: pointer; font-weight: 600;
      transition: all 0.2s;
    }
    .btn-toggle.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }

    /* Card Termine */
    .term-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 1.5rem; margin-bottom: 1.2rem;
    }
    .card-header {
      display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem;
    }
    .term-card h2 { color: var(--accent); font-size: 1.3rem; }
    .btn-delete {
      background: transparent; border: none; color: var(--text-muted); cursor: pointer;
      font-size: 1rem; padding: 0.2rem 0.5rem; border-radius: 4px;
    }
    .btn-delete:hover { color: var(--danger); background: rgba(239, 68, 68, 0.1); }

    .badge-group { display: flex; gap: 0.5rem; margin-bottom: 0.8rem; }
    .category-badge {
      display: inline-block; font-size: 0.75rem; background: var(--badge); color: white;
      padding: 0.2rem 0.6rem; border-radius: 4px; text-transform: uppercase; font-weight: 600;
    }
    .new-badge {
      display: inline-block; font-size: 0.75rem; background: var(--badge-new); color: white;
      padding: 0.2rem 0.6rem; border-radius: 4px; text-transform: uppercase; font-weight: 600;
    }
    .text-content { line-height: 1.6; color: var(--text); }

    /* Code Block */
    .code-block {
      margin-top: 1rem; background: var(--code-bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 1rem; overflow-x: auto;
    }
    .code-header { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.5rem; font-weight: 700; }
    pre code { font-family: 'Consolas', 'Fira Code', monospace; font-size: 0.88rem; color: #38bdf8; white-space: pre-wrap; word-break: break-word; }

    /* Not Found */
    .not-found-box {
      text-align: center; background: var(--card-bg); border: 1px dashed var(--border);
      border-radius: 10px; padding: 2.5rem 1.5rem; margin-top: 1rem;
    }
    .btn-search-web {
      margin-top: 1rem; padding: 0.7rem 1.2rem; background: var(--accent);
      color: var(--bg); border: none; border-radius: 6px; font-weight: 700;
      cursor: pointer; transition: background 0.2s;
    }
    .btn-search-web:hover { background: var(--accent-hover); }
    .spinner { display: inline-block; margin-top: 1rem; color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-box">
    <div class="header-titles">
      <h1>DevLexicon</h1>
      <p>Enciclopedia Tecnica Cloud con Sincronizzazione e Auto-Apprendimento AI</p>
    </div>
    <button class="btn-settings" title="Gestione Chiave Gemini" onclick="toggleSettings()">⚙️</button>
  </div>

  <!-- Pannello Impostazioni -->
  <div class="settings-panel" id="settingsPanel">
    <label style="font-size: 0.85rem; color: var(--text-muted);">Chiave Gemini Cloud (Sincronizzata su tutti i dispositivi):</label>
    <div class="settings-row">
      <input type="password" id="apiKeyInput" placeholder="Inserisci chiave Gemini...">
      <button class="btn-action" onclick="saveCloudApiKey()">Salva</button>
    </div>
  </div>

  <!-- Barra Info, Inizializzazione & Backup -->
  <div class="tools-bar">
    <div>
      <span id="termCount">Caricamento dal cloud...</span>
      <span class="sync-badge" id="syncStatus"> ● Cloud Connesso</span>
    </div>
    <div class="tools-buttons">
      <button class="btn-action btn-seed" onclick="seedDefaultTerms()">📥 Carica Enciclopedia Base (+60 Termini)</button>
      <button class="btn-action" onclick="exportData()">💾 Backup Locale</button>
    </div>
  </div>

  <!-- Barra Ricerca -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Cerca tra oltre 60 concetti (es. Docker, Sharding, CORS, RAG, Event Loop)...">
  </div>

  <!-- Categorie Dinamiche -->
  <div class="categories-bar" id="categoriesBar"></div>

  <!-- Switch Modalità -->
  <div class="view-toggle">
    <button class="btn-toggle active" id="btnSummary" onclick="setViewMode('summary')">Modalità Sintetica</button>
    <button class="btn-toggle" id="btnDetail" onclick="setViewMode('detail')">Modalità Dettagliata (con Esempi di Codice)</button>
  </div>

  <!-- Risultati -->
  <div id="termsList"></div>
</div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
    });
  }

  const firebaseConfig = {
    apiKey: "AIzaSyB2jGY3q3s4vDD_ARy-xltsjcwS3VDch7E",
    authDomain: "tachocontrol-ad132.firebaseapp.com",
    databaseURL: "https://tachocontrol-ad132-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "tachocontrol-ad132",
    storageBucket: "tachocontrol-ad132.firebasestorage.app",
    messagingSenderId: "337602106666",
    appId: "1:337602106666:web:d57e633e9cd487cf6fba53"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // PACCHETTO DI OLTRE 60 TERMINI APPROFONDITI E CATEGORIZZATI
  const initialTermsPack = [
    // --- ARCHITETTURA & PATTERN ---
    {
      term: "Architettura a Microservizi",
      category: "Architettura",
      summary: "Approccio architetturale in cui un'applicazione è disaccoppiata in una suite di servizi indipendenti, autonomi e comunicanti via rete.",
      detail: "Ogni microservizio possiede una propria base di codice, logica di business e spesso un proprio database dedicato. Favorisce il deploy indipendente e la scalabilità mirata rispetto ai monoliti.",
      code: `[Client Web/Mobile]\n        │ (HTTPS)\n  [API Gateway]\n   ├── [Auth Service] (PostgreSQL)\n   ├── [Fleet Service] (MongoDB)\n   └── [Billing Service] (MySQL)`,
      autoFetched: false
    },
    {
      term: "Architettura Esagonale (Ports & Adapters)",
      category: "Architettura",
      summary: "Pattern architetturale che isola il dominio e la logica di business fondamentale da framework esterni, database e interfacce grafiche.",
      detail: "Il nucleo applicativo comunica con il mondo esterno tramite 'Porte' (interfacce astratte) implementate da 'Adattatori' (es. driver DB, controller REST, code). Rende il software testabile e indipendente dalle tecnologie esterne.",
      code: `// Porta (Interfaccia Dominio)\ninterface VehicleRepository {\n  findById(id: string): Promise<Vehicle>;\n}\n\n// Adattatore (Infrastruttura)\nclass PostgresVehicleRepo implements VehicleRepository {\n  async findById(id: string) { return await db.query('SELECT * FROM vehicles WHERE id = $1', [id]); }\n}`,
      autoFetched: false
    },
    {
      term: "CQRS (Command Query Responsibility Segregation)",
      category: "Architettura",
      summary: "Pattern architetturale che separa nettamente le operazioni di lettura (Query) da quelle di scrittura/modifica (Command).",
      detail: "Permette di ottimizzare modelli dati differenti: una struttura normalizzata e protetta da vincoli per la scrittura e una struttura denormalizzata, ad alte prestazioni o in sola lettura per le query complesse.",
      code: `// Command: Modifica lo stato\nclass RegisterDriverCommand { constructor(public driverData: DriverDto) {} }\n\n// Query: Recupera dati ottimizzati\nclass GetDriverScheduleQuery { constructor(public vehicleId: string) {} }`,
      autoFetched: false
    },
    {
      term: "Event-Driven Architecture (EDA)",
      category: "Architettura",
      summary: "Architettura software asincrona basata sulla produzione, rilevamento e consumo di eventi distribuiti.",
      detail: "I componenti non invocano direttamente altri moduli (disaccoppiamento temporale e spaziale), ma pubblicano eventi su un message broker (es. Apache Kafka, RabbitMQ) che vengono elaborati asincronamente da uno o più sottoscrittori.",
      code: `// Pubblicazione Evento\neventEmitter.emit('DRIVER_CARD_DOWNLOADED', {\n  driverId: 'D_102',\n  downloadDate: new Date(),\n  nextDeadlineDays: 28\n});`,
      autoFetched: false
    },
    {
      term: "Singleton Pattern",
      category: "Architettura",
      summary: "Design pattern creazionale che garantisce che una determinata classe abbia un'unica istanza globale accessibile ovunque.",
      detail: "Viene impiegato per risorse centralizzate condivise che richiedono un unico punto di coordinamento, come pool di connessione al database, logger di sistema o configurazioni globali.",
      code: `class DatabasePool {\n  private static instance: DatabasePool;\n  private constructor() { /* inizializza pool */ }\n  public static getInstance(): DatabasePool {\n    if (!DatabasePool.instance) DatabasePool.instance = new DatabasePool();\n    return DatabasePool.instance;\n  }\n}`,
      autoFetched: false
    },
    {
      term: "Dependency Injection (DI)",
      category: "Architettura",
      summary: "Tecnica in cui un oggetto riceve le proprie dipendenze dall'esterno anziché crearle internamente.",
      detail: "Facilita il principio di inversione del controllo (IoC) e rende il codice facilmente testabile, permettendo di sostituire dipendenze reali con mock o stub nei test automatizzati.",
      code: `class NotificationService {\n  constructor(private emailSender: EmailClient) {}\n  sendDeadlineAlert(to: string) {\n    this.emailSender.send(to, 'Scadenza imminente!');\n  }\n}`,
      autoFetched: false
    },

    // --- FRONTEND & WEB PLATFORM ---
    {
      term: "Virtual DOM",
      category: "Frontend",
      summary: "Rappresentazione virtuale e leggera del DOM mantenuta in memoria da framework moderni come React o Vue.",
      detail: "A ogni cambio di stato, viene generato un nuovo albero virtuale. Un algoritmo di riconciliazione ('diffing') calcola la differenza minima con l'albero precedente e aggiorna solo i nodi reali necessari, massimizzando le performance.",
      code: `// React Element (nodo Virtual DOM leggero)\nconst element = React.createElement('h1', { className: 'title' }, 'TachoControl Fleet');`,
      autoFetched: false
    },
    {
      term: "Service Worker",
      category: "Frontend",
      summary: "Script eseguito dal browser in background, separato dal thread della pagina web, fondamentale per le PWA.",
      detail: "Intercetta le richieste di rete HTTP, gestisce strategie di caching avanzate (Cache-First, Network-First), consente il funzionamento offline e riceve notifiche push in background anche ad app chiusa.",
      code: `self.addEventListener('fetch', (event) => {\n  event.respondWith(\n    caches.match(event.request).then((cached) => cached || fetch(event.request))\n  );\n});`,
      autoFetched: false
    },
    {
      term: "Web Workers",
      category: "Frontend",
      summary: "API del browser che consente l'esecuzione di script JavaScript in thread paralleli in background senza bloccare la UI.",
      detail: "Poiché il thread principale di JavaScript gestisce il rendering e gli eventi utente, operazioni computazionalmente pesanti (es. decodifica file tachigrafo DDD, crittografia) possono essere delegate a un Worker.",
      code: `// Main Thread\nconst worker = new Worker('parserWorker.js');\nworker.postMessage(rawBinaryBuffer);\nworker.onmessage = (e) => console.log('File elaborato:', e.data);`,
      autoFetched: false
    },
    {
      term: "React Hooks (useState, useEffect)",
      category: "Frontend",
      summary: "Funzioni speciali che consentono ai componenti funzionali di utilizzare lo stato e le funzionalità del ciclo di vita.",
      detail: "`useState` mantiene lo stato locale ri-renderizzando il componente alle variazioni; `useEffect` gestisce gli effetti collaterali (chiamate API, sottoscrizioni a stream, timer) sincronizzandosi con il ciclo di vita.",
      code: `import { useState, useEffect } from 'react';\n\nfunction DriverCard() {\n  const [days, setDays] = useState(28);\n  useEffect(() => {\n    console.log('Giorni aggiornati a:', days);\n  }, [days]);\n  return <button onClick={() => setDays(days - 1)}>Riduci</button>;\n}`,
      autoFetched: false
    },
    {
      term: "Hydration (SSR)",
      category: "Frontend",
      summary: "Processo in cui un framework lato client (React/Vue) si collega all'HTML statico pre-renderizzato dal server rendendolo interattivo.",
      detail: "Nel Server-Side Rendering (SSR), il server invia HTML già pronto per un primo caricamento rapido. Nel browser, il runtime JavaScript esegue l'hydration associando i listener di eventi al markup esistente senza ricreare la pagina.",
      code: `// Idratazione React sul DOM lato client\nimport { hydrateRoot } from 'react-dom/client';\nhydrateRoot(document.getElementById('root'), <App />);`,
      autoFetched: false
    },
    {
      term: "CSS Box Model",
      category: "Frontend",
      summary: "Modello geometrico fondamentale che definisce lo spazio occupato da ogni elemento HTML sul layout della pagina.",
      detail: "È composto dall'interno verso l'esterno da: Content (contenuto reale), Padding (spazio interno), Border (bordo) e Margin (spazio esterno). L'impostazione `box-sizing: border-box` include padding e border nella larghezza totale.",
      code: `* {\n  box-sizing: border-box; /* Larghezza include padding e bordo */\n  margin: 0;\n  padding: 0;\n}`,
      autoFetched: false
    },

    // --- BACKEND & RUNTIME ---
    {
      term: "Event Loop (Node.js / JS)",
      category: "Backend",
      summary: "Meccanismo a singolo thread che gestisce l'esecuzione asincrona non bloccante in JavaScript delegando I/O al sistema.",
      detail: "Monitora il Call Stack e la Callback Queue: quando il call stack è vuoto, sposta i callback pronti (timer, I/O su file o rete) nello stack per l'esecuzione, consentendo a Node.js di servire migliaia di connessioni concorrenti.",
      code: `console.log('1 - Inizio');\nsetTimeout(() => console.log('2 - Callback Timer'), 0); // Asincrono\nconsole.log('3 - Fine');\n// Output: 1, 3, 2`,
      autoFetched: false
    },
    {
      term: "Concorrenza vs Parallelismo",
      category: "Backend",
      summary: "La concorrenza riguarda la gestione di più compiti contemporaneamente; il parallelismo riguarda l'esecuzione simultanea su più core fisici.",
      detail: "Un sistema concorrente può alternare rapidamente compiti su una singola CPU (time-slicing o I/O multiplexing). Il parallelismo richiede hardware multi-core per calcoli fisicamente simultanei.",
      code: `// Concorrenza (Node.js I/O asincrono su singolo thread):\nPromise.all([fetchVehicles(), fetchDrivers()]);\n\n// Parallelismo (Worker threads su core separati):\nconst { Worker } = require('worker_threads');`,
      autoFetched: false
    },
    {
      term: "Connection Pooling",
      category: "Backend",
      summary: "Tecnica che mantiene una cache di connessioni al database attive e riutilizzabili per evitare il sovraccarico di connessioni continue.",
      detail: "Aprire una connessione TCP con handshake e autenticazione verso il DB è un'operazione onerosa. Il pool alloca un numero prefissato di socket riutilizzati dalle richieste backend man mano che si liberano.",
      code: `const { Pool } = require('pg');\nconst pool = new Pool({ max: 20, idleTimeoutMillis: 30000 });\nconst client = await pool.connect();\nconst res = await client.query('SELECT * FROM flotta');\nclient.release();`,
      autoFetched: false
    },
    {
      term: "Memory Leak",
      category: "Backend",
      summary: "Condizione anomala in cui la memoria allocata da un programma non viene liberata dal Garbage Collector.",
      detail: "Spesso causata da listener di eventi mai rimossi, riferimenti globali non puliti o closure che trattengono oggetti di grandi dimensioni, portando all'esaurimento della RAM e al crash del processo (`Out of Memory`).",
      code: `// Esempio tipico di leak:\nconst leakArray = [];\nsetInterval(() => {\n  leakArray.push(new Buffer.alloc(1024 * 1024)); // Cresce indefinitamente\n}, 100);`,
      autoFetched: false
    },
    {
      term: "Node.js Streams",
      category: "Backend",
      summary: "Interfacce per leggere o scrivere dati in modo continuo e frammentato (chunk by chunk) senza caricare l'intero file in RAM.",
      detail: "Indispensabili per manipolare file di grandi dimensioni, log o video streaming con bassissimo consumo di memoria grazie al controllo del backpressure.",
      code: `const fs = require('fs');\nconst readStream = fs.createReadStream('archivio_pesante.zip');\nconst writeStream = fs.createWriteStream('copia.zip');\nreadStream.pipe(writeStream);`,
      autoFetched: false
    },

    // --- DATABASE & STORAGE ---
    {
      term: "Transazioni ACID",
      category: "Database",
      summary: "Insieme di 4 proprietà fondamentali che garantiscono l'affidabilità e l'integrità dei dati nei database relazionali.",
      detail: "Atomicity (tutto o niente), Consistency (rispetto dei vincoli), Isolation (transazioni concorrenti separate), Durability (dati salvati anche dopo un crash hardware).",
      code: `BEGIN TRANSACTION;\nUPDATE conti SET saldo = saldo - 500 WHERE utente_id = 1;\nUPDATE conti SET saldo = saldo + 500 WHERE utente_id = 2;\nCOMMIT; -- Se fallisce un'istruzione: ROLLBACK;`,
      autoFetched: false
    },
    {
      term: "Database Sharding",
      category: "Database",
      summary: "Metodo di partizionamento orizzontale che divide una tabella gigante memorizzandola su più server database separati.",
      detail: "Ogni frammento ('shard') contiene un sottoinsieme di righe identificato tramite una chiave di sharding (es. `company_id` o `country_code`), permettendo scalabilità orizzontale a livello di terabyte.",
      code: `// Routing tramite Shard Key\nfunction getDatabaseNode(companyId) {\n  return companyId % 2 === 0 ? 'db-cluster-nodeA' : 'db-cluster-nodeB';\n}`,
      autoFetched: false
    },
    {
      term: "Teorema CAP",
      category: "Database",
      summary: "Principio teorico che stabilisce che un sistema distribuito può garantire al massimo due proprietà su tre: Coerenza, Disponibilità, Tolleranza alle partizioni.",
      detail: "In presenza di partizioni di rete (P), un database distribuito deve scegliere se privilegiare dati sempre coerenti e aggiornati (CP, es. HBase, CockroachDB) o rispondere sempre anche con dati parzialmente disallineati (AP, es. Cassandra, DynamoDB).",
      code: `Consistency (Coerenza) ──── Availability (Disponibilità)\n           \\                 /\n            \\               /\n        Partition Tolerance (Tolleranza)`,
      autoFetched: false
    },
    {
      term: "Redis (In-Memory Cache)",
      category: "Database",
      summary: "Store dati chiave-valore in-memory ad altissime prestazioni utilizzato per caching, sessioni e code veloci.",
      detail: "Memorizzando i dati interamente nella memoria RAM con persistenza opzionale su disco, garantisce tempi di risposta sub-millisecondo per query frequenti o calcolo di rate-limiting.",
      code: `// Caching con Redis\nconst cached = await redis.get('scadenze_flotta');\nif (cached) return JSON.parse(cached);\nconst data = await fetchFromPostgres();\nawait redis.setex('scadenze_flotta', 3600, JSON.stringify(data)); // TTL 1 ora`,
      autoFetched: false
    },
    {
      term: "Normalizzazione Database (1NF, 2NF, 3NF)",

  let glossary = [];
  let activeGeminiKey = '';
  let currentMode = 'summary';
  let selectedCategory = 'ALL';

  function toggleSettings() {
    document.getElementById('settingsPanel').classList.toggle('open');
  }

  // Sincronizzazione della chiave Gemini
  db.ref('settings/gemini_api_key').on('value', (snapshot) => {
    const keyVal = snapshot.val();
    if (keyVal) {
      activeGeminiKey = keyVal;
      document.getElementById('apiKeyInput').value = keyVal;
      localStorage.setItem('gemini_api_key', keyVal);
      document.getElementById('settingsPanel').classList.remove('open');
    } else {
      document.getElementById('settingsPanel').classList.add('open');
    }
  });

  // Sincronizzazione termini dal cloud
  db.ref('dev_lexicon_terms').on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
      glossary = Object.keys(data).map(key => ({ _fbKey: key, ...data[key] }));
    } else {
      glossary = [];
    }
    renderCategories();
    renderTerms(document.getElementById('searchInput').value);
  });

  // Caricamento del pacchetto di 60+ termini su Firebase
  async function seedDefaultTerms() {
    if (!confirm(`Vuoi caricare l'enciclopedia tecnica (${initialTermsPack.length} termini approfonditi) sul tuo database Firebase?`)) return;
    
    const updates = {};
    initialTermsPack.forEach(term => {
      const termId = term.term.toLowerCase().replace(/[^a-z0-9]/g, '_');
      updates[termId] = term;
    });

    try {
      await db.ref('dev_lexicon_terms').update(updates);
      alert(`Enciclopedia caricata con successo! ${initialTermsPack.length} termini sincronizzati.`);
    } catch (err) {
      alert('Errore durante il caricamento: ' + err.message);
    }
  }

  function saveCloudApiKey() {
    const key = document.getElementById('apiKeyInput').value.trim();
    if (!key) return;
    db.ref('settings/gemini_api_key').set(key)
      .then(() => {
        alert('Chiave salvata su Cloud!');
        toggleSettings();
      })
      .catch(err => alert('Errore Firebase: ' + err.message));
  }

  function setViewMode(mode) {
    currentMode = mode;
    document.getElementById('btnSummary').classList.toggle('active', mode === 'summary');
    document.getElementById('btnDetail').classList.toggle('active', mode === 'detail');
    renderTerms(document.getElementById('searchInput').value);
  }

  function setCategory(cat) {
    selectedCategory = cat;
    renderCategories();
    renderTerms(document.getElementById('searchInput').value);
  }

  function renderCategories() {
    const catBar = document.getElementById('categoriesBar');
    const categories = ['ALL', ...new Set(glossary.map(item => item.category || 'Generale'))];
    
    catBar.innerHTML = categories.map(cat => `
      <button class="cat-filter-btn ${selectedCategory === cat ? 'active' : ''}" 
              onclick="setCategory('${escapeHtml(cat)}')">
        ${cat === 'ALL' ? 'Tutte le Categorie' : escapeHtml(cat)}
      </button>
    `).join('');
  }

  function deleteTerm(fbKey, termName) {
    if (confirm(`Vuoi eliminare definitivamente "${termName}" dal database cloud?`)) {
      db.ref('dev_lexicon_terms/' + fbKey).remove();
    }
  }

  function exportData() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(glossary, null, 2));
    const a = document.createElement('a');
    a.setAttribute("href", dataStr);
    a.setAttribute("download", `glossario_cloud_${new Date().toISOString().slice(0, 10)}.json`);
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function renderTerms(query = '') {
    const listContainer = document.getElementById('termsList');
    const cleanQuery = query.trim().toLowerCase();
    document.getElementById('termCount').innerText = `${glossary.length} termini memorizzati`;

    let filtered = glossary.filter(item => {
      const matchQuery = item.term.toLowerCase().includes(cleanQuery) || 
                         (item.category && item.category.toLowerCase().includes(cleanQuery)) ||
                         (item.summary && item.summary.toLowerCase().includes(cleanQuery));
      const matchCat = (selectedCategory === 'ALL' || item.category === selectedCategory);
      return matchQuery && matchCat;
    });

    if (filtered.length === 0 && cleanQuery.length > 0) {
      listContainer.innerHTML = `
        <div class="not-found-box">
          <p>Il termine "<strong>${escapeHtml(query)}</strong>" non è presente nell'enciclopedia.</p>
          <button class="btn-search-web" onclick="fetchTermFromWeb('${escapeHtml(query)}')">
            🔍 Cerca e Genera Scheda Tecnica con AI
          </button>
          <div id="fetchLoader"></div>
        </div>
      `;
      return;
    }

    listContainer.innerHTML = filtered.map(item => `
      <div class="term-card">
        <div class="card-header">
          <h2>${escapeHtml(item.term)}</h2>
          <button class="btn-delete" title="Elimina dal Cloud" onclick="deleteTerm('${item._fbKey}', '${escapeHtml(item.term)}')">🗑️</button>
        </div>
        <div class="badge-group">
          <span class="category-badge">${escapeHtml(item.category || 'Generale')}</span>
          ${item.autoFetched ? '<span class="new-badge">Generato con AI</span>' : ''}
        </div>
        <p class="text-content">
          ${escapeHtml(currentMode === 'summary' ? item.summary : item.detail)}
        </p>
        ${currentMode === 'detail' && item.code ? `
          <div class="code-block">
            <div class="code-header">Snippet / Esempio Pratico:</div>
            <pre><code>${escapeHtml(item.code)}</code></pre>
          </div>
        ` : ''}
      </div>
    `).join('');
  }

  async function fetchTermFromWeb(searchTerm) {
    const apiKey = activeGeminiKey || localStorage.getItem('gemini_api_key');
    const loader = document.getElementById('fetchLoader');

    if (!apiKey) {
      alert('Chiave API non trovata. Clicca sull\'icona ⚙️ in alto a destra per inserirla.');
      return;
    }

    loader.innerHTML = `<span class="spinner">Interrogazione AI e compilazione scheda tecnica in corso...</span>`;

    const prompt = `Fornisci una scheda tecnica esaustiva sul seguente concetto di sviluppo software: "${searchTerm}".
Rispondi RIGOROSAMENTE ed ESCLUSIVAMENTE con un JSON valido (senza blocchi markdown \`\`\`json):
{
  "term": "Nome formale del termine",
  "category": "Una tra: Frontend, Backend, Database, Cloud, DevOps, Architettura, Sicurezza, Algoritmi, Networking, Testing, AI & Dati",
  "summary": "Definizione sintetica ma rigorosa (2 frasi).",
  "detail": "Spiegazione tecnica approfondita con architettura, casi d'uso ed errori comuni.",
  "code": "Snippet di codice o comando reale completo che esemplifica il funzionamento."
}`;

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
      });

      const data = await response.json();
      if (data.error) throw new Error(data.error.message);

      let rawText = data.candidates[0].content.parts[0].text;
      rawText = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();

      const newTerm = JSON.parse(rawText);
      newTerm.autoFetched = true;

      const termId = newTerm.term.toLowerCase().replace(/[^a-z0-9]/g, '_');
      await db.ref('dev_lexicon_terms/' + termId).set(newTerm);

      document.getElementById('searchInput').value = '';
      renderTerms();

    } catch (err) {
      loader.innerHTML = `<p style="color: #ef4444; margin-top: 1rem;">Errore: ${err.message}</p>`;
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  document.getElementById('searchInput').addEventListener('input', (e) => {
    renderTerms(e.target.value);
  });
</script>

</body>
</html>
